<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio</title>
    <style>
        /* 기본 여백 제거 및 전체 화면 설정 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #9cbcae;
            overflow: hidden; /* 모바일에서 스크롤 방지 */
            display: flex;
            justify-content: center;
        }

        /* 도메인 화면 크기를 예시 사진 비율과 동일하게 고정 */
        .container {
            position: relative;
            width: 100%;
            height: 100dvh; /* 화면 높이에 꽉 차게 */
            max-width: 600px; /* 화면이 너무 넓은 기기에서도 비율 유지 */
            background-color: #9cbcae;
            overflow: hidden;
        }

        /* 중간 점선 */
        .divider {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 100%;
            z-index: 1;
            pointer-events: none; /* 클릭 간섭 방지 */
        }
        .divider img {
            height: 100%;
            width: auto;
            object-fit: cover;
        }

        /* 클릭 가능한 이미지들 공통 속성 */
        a {
            position: absolute;
            display: block;
            transition: transform 0.2s ease-in-out;
            z-index: 2; 
            /* 💡 핵심 변경점: 겹치는 투명 배경이 클릭을 막지 않도록 전체 영역 클릭을 끕니다. */
            pointer-events: none;
        }
        a:hover, a:active {
            transform: scale(1.02);
        }

        a img {
            width: 100%;
            height: auto;
            display: block;
            border: none;
            pointer-events: none;
        }

        /* 💡 핵심 변경점: 실제로 클릭될 영역(hitbox) 설정 */
        .hitbox {
            position: absolute;
            pointer-events: auto; /* 지정된 hitbox 영역만 클릭이 가능하도록 켭니다. */
            /* background-color: rgba(255, 0, 0, 0.3); */ /* 👈 이 주석을 풀면 클릭 영역이 빨간색으로 보여서 세밀한 위치 조정이 편해집니다. */
        }

        /* 1. 왼쪽 식물 (어긋살기) - 위치/크기 유지 */
        .plant-left {
            bottom: -3%;
            left: -1%;
            width: 90%;
        }
        /* 왼쪽 식물의 실제 그림 부분에만 클릭 영역 맞추기 */
        .plant-left .hitbox {
            top: 20%;
            bottom: 0;
            left: 0;
            width: 50%; /* 투명한 오른쪽 절반은 클릭 영역에서 제외 */
        }

        /* 2. 오른쪽 상단 (포폴 증사) - 위치/크기 유지 */
        .portrait {
            top: -5%; 
            right: 3%;
            width: 60%; 
        }
        /* 포폴 증사의 실제 그림 부분에만 클릭 영역 맞추기 */
        .portrait .hitbox {
            top: 10%;
            bottom: 10%;
            right: 0;
            width: 60%; /* 투명한 왼쪽 부분은 클릭 영역에서 제외 */
        }

        /* 3. 오른쪽 하단 (동인하초) - 위치/크기 유지 */
        .plant-right {
            bottom: -1%;
            right: 1%;
            width: 85%; 
        }
        /* 동인하초의 실제 그림 부분에만 클릭 영역 맞추기 */
        .plant-right .hitbox {
            top: 30%;
            bottom: 0;
            right: 0;
            width: 50%; /* 투명한 왼쪽 절반은 클릭 영역에서 제외 */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 중간 점선 -->
        <div class="divider">
            <img src="중간 점선.png" alt="중간 점선">
        </div>

        <!-- 1. 왼쪽 식물 (어긋살기) -->
        <a href="어긋살기.jpg" target="_blank" class="plant-left">
            <img src="어긋살기 설명.png" alt="어긋살기 설명">
            <div class="hitbox"></div> <!-- 정확한 클릭 영역 -->
        </a>

        <!-- 2. 오른쪽 상단 (포폴 증사) -> portfolio_2.pdf 로 정상 연결 -->
        <a href="portfolio.pdf" target="_blank" class="portrait">
            <img src="포폴 증사.png" alt="포트폴리오 증명사진">
            <div class="hitbox"></div> <!-- 정확한 클릭 영역 -->
        </a>
        
        <!-- 3. 오른쪽 하단 (동인하초) -->
        <a href="동인하초.pdf" target="_blank" class="plant-right">
            <img src="동인하초 한글버전.png" alt="동인하초">
            <div class="hitbox"></div> <!-- 정확한 클릭 영역 -->
        </a>
    </div>

</body>
</html>
