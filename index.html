<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        /* 기본 여백 제거 및 배경색 설정 */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #9cbcae; /* 예시 사진과 유사한 민트색 배경 */
        }

        /* 전체 레이아웃을 세로로 길게 설정 */
        .container {
            display: flex;
            width: 100%;
            /* 사이트의 세로 길이를 길게 설정 (숫자를 늘리거나 줄여서 길이 조절 가능) */
            min-height: 2500px; 
            position: relative;
        }

        /* 왼쪽 영역 */
        .left-pane {
            flex: 1;
            position: relative;
        }

        /* 중간 점선 영역 */
        .divider {
            width: 20px;
            height: 100%;
            /* 새로 첨부해주신 중간 점선_2.png 적용 및 세로 반복 */
            background-image: url('중간 점선_2.png');
            background-repeat: repeat-y;
            background-position: center top;
            background-size: contain;
        }

        /* 오른쪽 영역 */
        .right-pane {
            flex: 1;
            position: relative;
        }

        /* 공통 링크 스타일 (마우스 오버 시 살짝 커지는 효과) */
        a {
            display: block;
            transition: transform 0.2s ease-in-out;
        }
        a:hover {
            transform: scale(1.03);
        }

        img {
            width: 100%;
            height: auto;
            border: none;
        }

        /* 1. 왼쪽 식물 (어긋살기) 배치 */
        .plant-left {
            position: absolute;
            bottom: 5%;
            left: 15%;
            width: 60%;
            max-width: 350px;
        }

        /* 2. 오른쪽 상단 (포폴 증사) 배치 */
        .portrait {
            position: absolute;
            top: 40%; /* 세로로 길어졌으므로 위에서부터의 위치 지정 */
            left: 20%;
            width: 45%;
            max-width: 250px;
        }

        /* 3. 오른쪽 하단 (동인하초) 배치 */
        .plant-right {
            position: absolute;
            bottom: 5%;
            right: 15%;
            width: 50%;
            max-width: 250px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 왼쪽 영역 -->
        <div class="left-pane">
            <!-- 클릭 시 어긋살기.jpg 열림 -->
            <a href="어긋살기.jpg" target="_blank" class="plant-left">
                <img src="어긋살기 설명.jpg" alt="어긋살기 설명">
            </a>
        </div>

        <!-- 중간 점선 -->
        <div class="divider"></div>

        <!-- 오른쪽 영역 -->
        <div class="right-pane">
            <!-- 클릭 시 portfolio.pdf 열림 -->
            <a href="portfolio.pdf" target="_blank" class="portrait">
                <img src="포폴 증사.jpg" alt="포트폴리오 증명사진">
            </a>
            
            <!-- 클릭 시 동인하초.pdf 열림 -->
            <a href="동인하초.pdf" target="_blank" class="plant-right">
                <img src="동인하초 한글버전.png" alt="동인하초">
            </a>
        </div>
    </div>

</body>
</html>
