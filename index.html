<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio</title>
    <style>
        /* 기본 여백 제거 및 전체 화면 설정 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #9cbcae;
            overflow: hidden; /* 모바일에서 스크롤 방지 */
            display: flex;
            justify-content: center;
        }

        /* 도메인 화면 크기를 예시 사진 비율과 동일하게 고정 */
        .container {
            position: relative;
            width: 100%;
            height: 100dvh; /* 화면 높이에 꽉 차게 */
            max-width: 600px; /* 화면이 너무 넓은 기기에서도 비율 유지 */
            background-color: #9cbcae;
            overflow: hidden;
        }

        /* 중간 점선을 img 태그로 처리하여 무조건 보이게 설정 */
        .divider {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 100%;
            z-index: 1;
            pointer-events: none; /* 클릭 간섭 방지 */
        }
        .divider img {
            height: 100%;
            width: auto;
            object-fit: cover;
        }

        /* 클릭 가능한 이미지들 공통 속성 */
        a {
            position: absolute;
            display: block;
            transition: transform 0.2s ease-in-out;
            z-index: 2; /* 점선보다 위로 올라오게 설정 */
        }
        a:hover, a:active {
            transform: scale(1.02);
        }

        /* a 태그 안의 이미지가 공간을 꽉 채우도록 설정 */
        a img {
            width: 100%;
            height: auto;
            display: block;
            border: none;
        }

        /* 1. 왼쪽 식물 (어긋살기) - 크기 대폭 확대 및 바닥 밀착 */
        .plant-left {
            bottom: -3%;
            left: -1%;
            width: 90%;
        }

        /* 2. 오른쪽 상단 (포폴 증사) - 왼쪽 식물보다 높은 곳 위치 */
        .portrait {
            top: -5%; 
            right: 3%;
            width: 60%; 
        }

        /* 3. 오른쪽 하단 (동인하초) - 크기 확대 및 바닥 밀착 */
        .plant-right {
            bottom: -1%;
            right: 1%;
            width: 85%; 
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 중간 점선 (직접 img 태그로 삽입) -->
        <div class="divider">
            <img src="중간 점선.png" alt="중간 점선">
        </div>

        <!-- 1. 왼쪽 식물 (어긋살기) -->
        <a href="어긋살기.jpg" target="_blank" class="plant-left">
            <img src="어긋살기 설명.png" alt="어긋살기 설명">
        </a>

        <!-- 2. 오른쪽 상단 (포폴 증사) -> portfolio_2.pdf 로 수정됨 -->
        <a href="portfolio.pdf" target="_blank" class="portrait">
            <img src="포폴 증사.png" alt="포트폴리오 증명사진">
        </a>
        
        <!-- 3. 오른쪽 하단 (동인하초) -->
        <a href="동인하초.pdf" target="_blank" class="plant-right">
            <img src="동인하초 한글버전.png" alt="동인하초">
        </a>
    </div>

</body>
</html>
